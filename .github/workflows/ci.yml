name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tools
        run: pip install black flake8
      - name: Black (check only)
        run: black --check src/ tests/ || true
      - name: Flake8
        run: flake8 src/ tests/ --max-line-length=88 --extend-ignore=E501,W503 || true

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run validation toolkit
        run: python tests/validate_toolkit.py --quiet || python tests/validate_toolkit.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bandit
        run: |
          pip install bandit
          bandit -r src/ -ll -x tests/ || true
